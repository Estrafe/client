<svg width="300" height="180" viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Metallic Gradient for the Card -->
        <linearGradient id="metallic-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#B0B0B0" />
            <stop offset="25%" stop-color="#E0E0E0" />
            <stop offset="50%" stop-color="#A0A0A0" />
            <stop offset="75%" stop-color="#E0E0E0" />
            <stop offset="100%" stop-color="#B0B0B0" />
        </linearGradient>

        <!-- Black Magnetic Stripe -->
        <linearGradient id="black-stripe" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#111" />
            <stop offset="100%" stop-color="#333" />
        </linearGradient>

        <!-- Signature Box Gradient -->
        <linearGradient id="signature-gradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#F5F5F5" />
            <stop offset="100%" stop-color="#E0E0E0" />
        </linearGradient>

        <!-- Hologram Effect -->
        <radialGradient id="holo-gradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#b91c1d" />
                <stop offset="50%" stop-color="#ff6d6d" stop-opacity="40%"/>
        </radialGradient>
    </defs>

    <!-- Card Background -->
    <rect x="10" y="10" width="280" height="160" rx="10" ry="10" fill="url(#metallic-gradient)"/>

    <!-- Black Magnetic Stripe -->
    <rect x="10" y="30" width="280" height="30" rx="3" fill="url(#black-stripe)"/>

    <!-- Signature Box -->
    <rect x="30" y="90" width="180" height="20" rx="3" fill="url(#signature-gradient)" stroke="#B0B0B0" stroke-width="1"/>
    <text x="35" y="105" font-family="'Lexend Deca', sans-serif" font-size="12" fill="#555" opacity="40%">
        Authorized Signature
    </text>

    <!-- CVV Code -->
    <rect x="220" y="90" width="40" height="20" rx="3" fill="#fff"/>
    <text x="240" y="105" font-family="'Lexend Deca', sans-serif" font-size="14" fill="#000" font-weight="bold" text-anchor="middle" opacity="70%">
        285
    </text>

    <!-- Decorative Separator -->
    <line x1="30" y1="125" x2="270" y2="125" stroke="#FFFFFF" stroke-dasharray="4" stroke-opacity="0.5" />

    <!-- Card Holder Name -->
    <text x="30" y="145" font-family="'Lexend Deca', sans-serif" font-size="12" fill="white">
        DIEGO HERRERA REDONDO
    </text>

    <!-- Card Number -->
    <text x="30" y="160" font-family="'Lexend Deca', sans-serif" font-size="12" fill="white" letter-spacing="2px">
        3852 9240 1459 2042 8599
    </text>

    <!-- Hologram Effect -->
    <circle cx="250" cy="145" r="15" fill="url(#holo-gradient)" opacity="0.8"/>
</svg>
